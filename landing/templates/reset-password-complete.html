{% extends "base.html" %}
{% load static i18n %}

{% block navlink %}
<a class="navbar-brand" href="{% url 'landing:landing' %}">
  <span class="inline-block dark:hidden">
    <img src="{% if site_settings.logo_dark %}{{ site_settings.logo_dark.url }}{% else %}{% static 'assets/images/logo-dark.png' %}{% endif %}" class="l-dark" alt="">
    <img src="{% if site_settings.logo %}{{ site_settings.logo.url }}{% else %}{% static 'assets/images/logo-light.png' %}{% endif %}" class="l-light" alt="">
  </span>
  <img src="{% if site_settings.logo %}{{ site_settings.logo.url }}{% else %}{% static 'assets/images/logo-light.png' %}{% endif %}" class="hidden dark:inline-block" alt="">
</a>
{% endblock navlink %}

{% block Hero %}

<!-- Reset Password Complete Start -->
<section class="relative w-full flex-grow flex items-center py-24 bg-center bg-cover" style="background-image: url('{% static 'assets/images/bg/quraan_1080.jpg' %}');">
  <div class="absolute inset-0 bg-black opacity-80"></div>
  <div class="container relative">
    <div class="flex justify-center">
      <div class="w-full max-w-sm m-auto px-6 py-8 bg-white dark:bg-slate-900 rounded-md shadow-lg shadow-slate-500 dark:shadow-slate-800">
        <h5 class="mb-8 text-xl text-center dark:text-white font-semibold">{% trans "Password Changed" %}</h5>

        <p class="text-slate-400 dark:text-slate-300 mb-6">{% trans "Your password has been set successfully. You can now sign in with your new password." %}</p>

        <div class="text-center">
          <a href="{% url 'login' %}" class="btn bg-orange-600 hover:bg-orange-700 border-orange-600 hover:border-orange-700 text-white rounded-md w-full">{% trans "Sign in" %}</a>
        </div>
      </div>
    </div>
    <!--end flex-->
  </div>
  <!--end container-->
</section>
<!--end section-->
<!-- Reset Password Complete End -->

{% endblock Hero %}

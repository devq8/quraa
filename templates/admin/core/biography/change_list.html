{% extends "admin/change_list.html" %}
{% load i18n %}

{% block object-tools-items %}
<li>
  <a href="{% url 'admin:core_biography_find_duplicates' %}" class="addlink">
    {% trans "Find Duplicates" %}
  </a>
</li>
<li>
  <a href="{% url 'admin:core_biography_import_csv' %}" class="addlink">
    {% trans "Import CSV" %}
  </a>
</li>
<li>
  <a href="{% url 'admin:core_biography_import_reciters' %}" class="addlink">
    {% trans "Import Reciters CSV" %}
  </a>
</li>
<li>
  <a
    href="{% url 'admin:core_biography_export_csv' %}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}"
    class="addlink"
  >
    {% trans "Export CSV" %}
  </a>
</li>
<li>
  <a
    href="{% url 'admin:core_biography_export_xlsx' %}{% if request.GET %}?{{ request.GET.urlencode }}{% endif %}"
    class="addlink"
  >
    {% trans "Export XLSX" %}
  </a>
</li>
{{ block.super }}
{% endblock %}
